  name: API Tests

  on:
    workflow_dispatch:
      inputs:
        scope:
          description: "Test scope to execute"
          required: true
          default: "UnitTest"
          type: choice
          options:
            - UnitTest
            - EmptyEnvironmentTests
            - Reset
            - Cleanup

        threads:
          description: "Number of parallel test threads"
          required: true
          default: "2"
          type: string

    push:
      branches:
        - main
        - "feature/**"

    schedule:
      # Run once a month, on the 1st at 02:00 UTC
      - cron: "0 2 1 * *"

  jobs:
    test:
      runs-on: ubuntu-latest

      env:
        TEST_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || 'UnitTest' }}
        TEST_THREADS: ${{ github.event_name == 'workflow_dispatch' && inputs.threads || '2' }}

        GITLAB_ACCESS_TOKEN: ${{ secrets.GITLAB_ACCESS_TOKEN }}

      steps:
        - name: Checkout
          uses: actions/checkout@v6

        - name: Set up Java 17
          uses: actions/setup-java@v6
          with:
            distribution: temurin
            java-version: "17"
            cache: maven

        - name: Make Maven wrapper executable
          run: chmod +x ./mvnw

        - name: Run tests
          run: |
            ./mvnw clean test \
              -Dscope="${TEST_SCOPE}" \
              -Dthreads="${TEST_THREADS}"

        - name: Generate Allure report
          if: always()
          run: |
            ./mvnw allure:report

        - name: Upload Allure report
          if: always()
          uses: actions/upload-artifact@v7
          with:
            name: allure-report
            path: target/site
            retention-days: 7
            if-no-files-found: warn

        - name: Upload Surefire reports
          if: always()
          uses: actions/upload-artifact@v7
          with:
            name: surefire-reports
            path: target/surefire-reports
            retention-days: 7
            if-no-files-found: warn

